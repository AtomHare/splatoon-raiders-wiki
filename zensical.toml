# Zensical configuration — https://zensical.org/docs/setup/basics/
#
# There is deliberately NO `nav` setting: the menu is generated from the
# folders in docs/. Adding a page = adding a .md file. Page titles come from
# the first `# Heading` of each file.

[project]
site_name = "Splatoon Raiders Community Wiki"
site_description = "Community-curated strategies, builds, videos and tips for Splatoon Raiders. Game data lives on Inkipedia."
site_url = "https://atomhare.github.io/splatoon-raiders-wiki/"
repo_url = "https://github.com/AtomHare/splatoon-raiders-wiki"
repo_name = "AtomHare/splatoon-raiders-wiki"
edit_uri = "edit/main/docs/"
copyright = """
Fan-made community wiki, not affiliated with or endorsed by Nintendo.
Splatoon is a trademark of Nintendo. Tips, videos and screenshots are credited
to and remain the property of their respective authors.
"""
extra_css = ["stylesheets/extra.css"]

[project.theme]
language = "en"
features = [
  "content.action.edit",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.sections",
  "navigation.tabs",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.plugins.tags]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
